<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FoodWise RWP — AI-powered personalized food discovery and recommendation prototype for Rawalpindi." />
    <title>FoodWise RWP — AI Food Discovery for Rawalpindi</title>
    <script type="text/javascript">
      // Counterpart to public/404.html's redirect trick (see comments
      // there) — decodes the real path back out of the query string
      // before React Router mounts, so deep links work on GitHub Pages.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-cream text-charcoal antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
